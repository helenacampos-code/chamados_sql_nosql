
{% extends "base.html" %}

{% block title %}Novo chamado{% endblock %}

{% block content %}

<div class="cabecalho-pagina">
    <div>
        <p class="etiqueta">NOVA SOLICITAÇÃO</p>
        <h1>Cadastrar chamado</h1>
        <p class="subtitulo">
            Preencha os dados para registrar uma solicitação.
        </p>
    </div>
</div>

<form class="painel formulario" method="POST">

    <label>
        Nome do solicitante
        <input
            type="text"
            name="solicitante"
            placeholder="Ex.: Ana Souza"
            required
        >
    </label>

    <label>
        Equipamento
        <input
            type="text"
            name="equipamento"
            placeholder="Ex.: Notebook Dell"
            required
        >
    </label>

    <label>
        Categoria

        <select name="categoria_id" required>
            <option value="">Selecione...</option>

            {% for c in categorias %}
            <option value="{{ c.id }}">
                {{ c.nome }}
            </option>
            {% endfor %}

        </select>
    </label>

    <label>
        Descrição do problema
        <textarea
            name="descricao"
            rows="5"
            placeholder="Explique o problema..."
            required
        ></textarea>
    </label>

    <label>
        Responsável pelo registro
        <input
            type="text"
            name="responsavel"
            placeholder="Nome do responsável (opcional)"
        >
    </label>

    <div class="acoes">
        <button class="botao" type="submit">
            Salvar chamado
        </button>

        <a class="botao secundario"
           href="{{ url_for('index') }}">
            Cancelar
        </a>
    </div>

</form>

{% endblock %}


<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Suporte Técnico{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="topo">

        <a class="marca" href="{{ url_for('index') }}">
            SUPORTE<span>+</span>
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Chamados</a>
            <a href="{{ url_for('novo_chamado') }}">Novo chamado</a>
        </nav>

    </div>
</header>

<main>

    {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% for categoria, mensagem in mensagens %}

            <div class="alerta {{ categoria }}">
                {{ mensagem }}
            </div>

        {% endfor %}

    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer>
    Projeto acadêmico — Integração SQL e NoSQL
</footer>

</body>
</html>
